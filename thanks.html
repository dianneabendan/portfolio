
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent | Estan Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .checkmark {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 36px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.7;
        }

        .back-button {
            display: inline-block;
            padding: 13px 28px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="checkmark">&#10003;</div>

        <h1>Message Sent!</h1>

        <p>
            Thank you for reaching out.
            Your message has been submitted successfully.
            I'll get back to you as soon as possible.
        </p>

        <a
            class="back-button"
            href="https://dianneabendan.github.io/portfolio/"
        >
            &larr; Go Back to Portfolio
        </a>
    </main>
</body>
</html>
